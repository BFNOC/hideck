name: Build fnOS package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published Docker version, e.g. 2.1.23'
        required: true
      http_port:
        description: 'HiDeck management HTTP port'
        required: true
        default: '7575'
  pull_request:
    paths:
      - 'packaging/fnos/**'
      - 'packaging/tests/**'
      - 'config/config.example.yaml'
      - '.github/workflows/fnos-package.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package and lifecycle tests
        run: timeout 60 python3 -m unittest discover -s packaging/tests -v

  package:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
      HTTP_PORT: ${{ inputs.http_port }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate release inputs
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'packaging/fnos')
          from build import release_version, http_port
          version = release_version(os.environ['PACKAGE_VERSION'])
          http_port(os.environ['HTTP_PORT'])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'PACKAGE_VERSION={version}\n')
          PY
      - name: Check published image architectures
        run: |
          timeout 60 docker buildx imagetools inspect --raw "yibaiba/hideck:$PACKAGE_VERSION" > "$RUNNER_TEMP/image.json"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | index("amd64") != null and index("arm64") != null' "$RUNNER_TEMP/image.json"
      - name: Download pinned official fnpack
        run: |
          curl -fL --connect-timeout 10 --max-time 60 \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 -o "$RUNNER_TEMP/fnpack"
          printf '%s  %s\n' 54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93 "$RUNNER_TEMP/fnpack" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/fnpack"
      - name: Build FPK
        run: |
          timeout 90 python3 packaging/fnos/build.py --version "$PACKAGE_VERSION" \
            --http-port "$HTTP_PORT" --fnpack "$RUNNER_TEMP/fnpack" --output dist/fnos
      - uses: actions/upload-artifact@v4
        with:
          name: hideck-fnos-${{ env.PACKAGE_VERSION }}
          path: dist/fnos/*
          if-no-files-found: error
