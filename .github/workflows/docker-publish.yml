name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'

env:
  DOCKER_IMAGE: yibaiba/hideck

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          for i in 1 2 3 4 5 6 7 8; do
            if gh release download "${tag}" -p 'hideck_*_linux_amd64' -p 'hideck_*_linux_arm64' --dir dist --clobber; then
              rm -f dist/*.sha256
              test -f dist/hideck_${tag}_linux_amd64
              test -f dist/hideck_${tag}_linux_arm64
              ls -lh dist/hideck_*
              exit 0
            fi
            echo "release binaries not ready, retry ${i}"
            sleep 20
          done
          echo "timed out waiting for GitHub Release binaries" >&2
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            # 语义化精确版本标签 (例如 v1.0.0 会被转换为 1.0.0)
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Prepare build args
        id: vars
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          echo "buildtime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"
          echo "revision=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            BUILDTIME=${{ steps.vars.outputs.buildtime }}
            REVISION=${{ steps.vars.outputs.revision }}
